name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip==26.1.2
        pip install --require-hashes -r requirements-dev.txt

    - name: Audit dependencies
      run: |
        pip-audit --strict -r requirements.txt

    - name: Check Python syntax
      run: |
        python -m py_compile bot.py settings.py
        python -m py_compile cogs/*.py
        python -m py_compile utils/*.py

    - name: Verify imports
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')

        # Test main imports
        import discord
        from discord.ext import commands
        from discord import app_commands
        import asyncio
        import psutil
        import yaml

        # Test local module imports with actual exports
        from utils.server_manager import ServerInstance, MultiServerManager
        from utils.permissions import check_role
        from utils.plugin_manager import list_plugins, update_plugin, check_all_plugin_updates

        print('All imports successful')
        "

    - name: Run ruff linter
      run: |
        ruff check . --select=E,F,W --ignore=E501 --exclude=venv

  notify:
    needs: lint
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
    - name: Notify Discord on CI Failure
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1)
        jq -n \
          --arg title "⚠️ CI Failed ($BRANCH)" \
          --arg desc "[$TITLE]($COMMIT_URL)" \
          '{flags:4096,embeds:[{title:$title,description:$desc,color:15105570}]}' \
          | curl -sS -H "Content-Type: application/json" -d @- ${{ secrets.DISCORD_WEBHOOK_URL }}
