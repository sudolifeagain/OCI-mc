name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements.txt

    - name: Check Python syntax
      run: |
        python -m py_compile bot.py settings.py
        python -m py_compile cogs/*.py
        python -m py_compile utils/*.py

    - name: Verify imports
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')

        # Test main imports
        import discord
        from discord.ext import commands
        from discord import app_commands
        import asyncio
        import psutil
        import yaml

        # Test local module imports with actual exports
        from utils.server_manager import ServerInstance, MultiServerManager
        from utils.permissions import check_role
        from utils.plugin_manager import list_plugins, update_plugin, check_all_plugin_updates

        print('All imports successful')
        "

    - name: Run ruff linter
      run: |
        ruff check . --select=E,F,W --ignore=E501,W503 --exclude=venv

  notify:
    needs: lint
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
    - name: Notify Discord on CI Failure
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/"/\\"/g')
        curl -H "Content-Type: application/json" \
          -d "{\"flags\":4096,\"embeds\":[{\"title\":\"⚠️ CI Failed ($BRANCH)\",\"description\":\"[$TITLE]($COMMIT_URL)\",\"color\":15105570}]}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
