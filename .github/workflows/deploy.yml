name: Deploy Bot to OCI

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # 0. rsyncのインストール
    - name: Install rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync

    # 1. SSH鍵のセットアップ
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

    # 1.5 リモートホストにrsyncをインストール
    - name: Install rsync on remote
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          sudo apt-get update
          sudo apt-get install -y rsync
        EOF

    # 2. ファイル転送 (rsync)
    - name: Sync files to OCI
      run: |
        rsync -avz --delete \
          --exclude '.git' \
          --exclude '.env' \
          --exclude 'venv' \
          -e "ssh -i ~/.ssh/id_rsa" \
          ./ ubuntu@${{ secrets.OCI_HOST }}:/opt/minecraft/bot/

    # 3. systemdユニットのデプロイと有効化
    - name: Deploy systemd unit and enable
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          if [ -f /opt/minecraft/bot/systemd/discord-bot.service ]; then
            sudo cp /opt/minecraft/bot/systemd/discord-bot.service /etc/systemd/system/discord-bot.service
            sudo chmod 644 /etc/systemd/system/discord-bot.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now discord-bot
          fi
        EOF

    # 4. 依存関係の更新とサービス再起動
    - name: Install dependencies & Restart Service
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          cd /opt/minecraft/bot
          ./venv/bin/pip install -r requirements.txt
          sudo systemctl daemon-reload || true
          sudo systemctl restart discord-bot || sudo systemctl start discord-bot
        EOF

    # 5. デプロイ成功通知
    - name: Notify Discord on Success
      if: success()
      run: |
        curl -H "Content-Type: application/json" \
          -d '{"embeds":[{"title":"デプロイ成功","color":3066993}]}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

    # 6. デプロイ失敗通知
    - name: Notify Discord on Failure
      if: failure()
      run: |
        curl -H "Content-Type: application/json" \
          -d '{"embeds":[{"title":"デプロイ失敗","color":15158332}]}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
