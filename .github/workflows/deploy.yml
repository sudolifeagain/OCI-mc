name: Deploy Bot to OCI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    # 0. rsyncのインストール
    - name: Install rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync

    # 1. SSH鍵のセットアップ
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    # 2. リモートホストにrsyncをインストール（未インストールの場合のみ）
    - name: Install rsync on remote
      run: |
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" \
          "command -v rsync >/dev/null || (sudo apt-get update && sudo apt-get install -y rsync)"

    # 3. 稼働サーバー状態を保存してBotを停止
    - name: Preserve runtime state and stop service
      run: |
        scp -i ~/.ssh/id_rsa \
          scripts/capture_running_servers.py \
          scripts/graceful_shutdown.py \
          "ubuntu@$OCI_HOST:/tmp/"
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" << 'EOF'
          set -e
          sudo install -d -m 0700 -o ubuntu -g ubuntu /opt/minecraft/.bot-runtime
          sudo python3 /tmp/capture_running_servers.py \
            --config /opt/minecraft/bot/config.json \
            --state /opt/minecraft/.bot-runtime/desired_servers.json
          sudo chown ubuntu:ubuntu /opt/minecraft/.bot-runtime/desired_servers.json
          sudo chmod 0600 /opt/minecraft/.bot-runtime/desired_servers.json
          touch /opt/minecraft/.bot-runtime/deploy_restore_required
          cd /opt/minecraft/bot
          ./venv/bin/python /tmp/graceful_shutdown.py \
            --config /opt/minecraft/bot/config.json \
            --state /opt/minecraft/.bot-runtime/desired_servers.json \
            --env /opt/minecraft/bot/.env
          rm /tmp/capture_running_servers.py /tmp/graceful_shutdown.py
          sudo systemctl stop discord-bot
        EOF

    # 4. ファイル転送 (rsync)
    - name: Sync files to OCI
      run: |
        rsync -avz --delete \
          --exclude '.git' \
          --exclude '.env' \
          --exclude 'venv' \
          --exclude 'user_permissions.json' \
          --exclude '.backup_fingerprints.json' \
          --exclude 'logs' \
          -e "ssh -i ~/.ssh/id_rsa" \
          ./ "ubuntu@$OCI_HOST:/opt/minecraft/bot/"

    # 5. ゲームサーバーを専用ユーザーへ分離
    - name: Apply host configuration with Ansible
      run: |
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" << 'EOF'
          set -e
          if [ ! -x /opt/minecraft/ansible-venv/bin/python ]; then
            sudo python3 -m venv /opt/minecraft/ansible-venv
          fi
          sudo /opt/minecraft/ansible-venv/bin/python -m pip install \
            --upgrade pip==26.1.2
          sudo /opt/minecraft/ansible-venv/bin/python -m pip install \
            --upgrade --require-hashes \
            -r /opt/minecraft/bot/infra/ansible/requirements.txt
          sudo env \
            ANSIBLE_CONFIG=/opt/minecraft/bot/infra/ansible/ansible.cfg \
            OCI_MC_REPO_ROOT=/opt/minecraft/bot \
            /opt/minecraft/ansible-venv/bin/ansible-playbook \
            -i /opt/minecraft/bot/infra/ansible/inventory/localhost.yml \
            /opt/minecraft/bot/infra/ansible/playbooks/host.yml
        EOF

    # 6. manifestで固定したPaper jarを検証して配置
    - name: Install verified Paper artifact
      run: |
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" << 'EOF'
          set -e
          sudo python3 /opt/minecraft/bot/scripts/manage_paper_artifact.py install \
            --manifest /opt/minecraft/bot/server-artifacts.json
        EOF

    # 7. 依存関係を更新
    - name: Install dependencies
      run: |
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" << 'EOF'
          cd /opt/minecraft/bot
          ./venv/bin/python -m pip install --upgrade pip==26.1.2
          ./venv/bin/python -m pip install --upgrade --require-hashes -r requirements.txt
          ./venv/bin/python -m pip check
        EOF

    # 9. サービス起動と稼働状態復元の確認
    - name: Start service and verify runtime restoration
      run: |
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" << 'EOF'
          set -e
          sudo systemctl daemon-reload
          sudo systemctl start discord-bot
          sleep 3
          sudo systemctl is-active discord-bot
          python3 /opt/minecraft/bot/scripts/verify_runtime.py \
            --config /opt/minecraft/bot/config.json \
            --state /opt/minecraft/.bot-runtime/desired_servers.json \
            --timeout 600
          sudo python3 /opt/minecraft/bot/scripts/manage_paper_artifact.py finalize
          rm -f /opt/minecraft/.bot-runtime/deploy_restore_required
          sudo systemd-analyze verify \
            /etc/systemd/system/discord-bot.service \
            /etc/systemd/system/minecraft-maintenance-reboot.service \
            /etc/systemd/system/minecraft-maintenance-reboot.timer \
            /etc/systemd/system/minecraft-post-reboot.service
          sudo systemctl is-enabled minecraft-maintenance-reboot.timer
          sudo systemctl is-active minecraft-maintenance-reboot.timer
          sudo systemctl is-enabled minecraft-post-reboot.service
          sudo test -x /usr/local/sbin/oci-mc-maintenance-reboot-finalize
          sudo test \
            "$(stat -c '%U:%G:%a' /usr/local/sbin/oci-mc-maintenance-reboot-finalize)" \
            = "root:root:750"
          test \
            "$(sudo stat -c '%U:%G:%a' /var/lib/oci-mc-maintenance)" \
            = "ubuntu:ubuntu:700"
        EOF

    # 10. 途中失敗時はPaperを旧jarへ戻して稼働状態を復旧
    - name: Recover service on failure
      if: failure()
      run: |
        ssh -i ~/.ssh/id_rsa "ubuntu@$OCI_HOST" << 'EOF'
          set -e
          if [ -f /opt/minecraft/.bot-runtime/deploy_restore_required ]; then
            sudo systemctl stop discord-bot || true
            if [ -f /opt/minecraft/bot/scripts/manage_paper_artifact.py ]; then
              sudo python3 /opt/minecraft/bot/scripts/manage_paper_artifact.py rollback
            fi
            sudo systemctl start discord-bot
            if [ -f /opt/minecraft/.bot-runtime/desired_servers.json ]; then
              python3 /opt/minecraft/bot/scripts/verify_runtime.py \
                --config /opt/minecraft/bot/config.json \
                --state /opt/minecraft/.bot-runtime/desired_servers.json \
                --timeout 600
            fi
            rm -f /opt/minecraft/.bot-runtime/deploy_restore_required
          else
            sudo systemctl start discord-bot
          fi
        EOF

    # 11. デプロイ成功通知
    - name: Notify Discord on Success
      if: success()
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1)
        BODY=$(echo "$COMMIT_MSG" | tail -n +2)
        if [ -n "$BODY" ]; then
          DESC=$(printf "[%s](%s)\n\n%s" "$TITLE" "$COMMIT_URL" "$BODY")
        else
          DESC=$(printf "[%s](%s)" "$TITLE" "$COMMIT_URL")
        fi
        jq -n \
          --arg desc "$DESC" \
          '{flags:4096,embeds:[{title:"✅ デプロイ成功",description:$desc,color:3066993}]}' \
          | curl -sS -H "Content-Type: application/json" -d @- ${{ secrets.DISCORD_WEBHOOK_URL }}

    # 12. デプロイ失敗通知
    - name: Notify Discord on Failure
      if: failure()
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1)
        BODY=$(echo "$COMMIT_MSG" | tail -n +2)
        if [ -n "$BODY" ]; then
          DESC=$(printf "[%s](%s)\n\n%s" "$TITLE" "$COMMIT_URL" "$BODY")
        else
          DESC=$(printf "[%s](%s)" "$TITLE" "$COMMIT_URL")
        fi
        jq -n \
          --arg desc "$DESC" \
          '{flags:4096,embeds:[{title:"❌ デプロイ失敗",description:$desc,color:15158332}]}' \
          | curl -sS -H "Content-Type: application/json" -d @- ${{ secrets.DISCORD_WEBHOOK_URL }}
