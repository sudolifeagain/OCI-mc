name: Deploy Bot to OCI

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # 0. rsyncのインストール
    - name: Install rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync

    # 1. SSH鍵のセットアップ
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

    # 1.5 リモートホストにrsyncをインストール（未インストールの場合のみ）
    - name: Install rsync on remote
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} "which rsync || (sudo apt-get update && sudo apt-get install -y rsync)"

    # 2. ファイル転送 (rsync)
    - name: Sync files to OCI
      run: |
        rsync -avz --delete \
          --exclude '.git' \
          --exclude '.env' \
          --exclude 'venv' \
          --exclude 'user_permissions.json' \
          --exclude '.backup_fingerprints.json' \
          --exclude 'logs' \
          -e "ssh -i ~/.ssh/id_rsa" \
          ./ ubuntu@${{ secrets.OCI_HOST }}:/opt/minecraft/bot/

    # 3. systemdユニットのデプロイと有効化
    - name: Deploy systemd unit and enable
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          if [ -f /opt/minecraft/bot/systemd/discord-bot.service ]; then
            sudo cp /opt/minecraft/bot/systemd/discord-bot.service /etc/systemd/system/discord-bot.service
            sudo chmod 644 /etc/systemd/system/discord-bot.service
            sudo systemctl daemon-reload
            sudo systemctl enable discord-bot
          fi
        EOF

    # 4. 依存関係の更新
    - name: Install dependencies
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          cd /opt/minecraft/bot
          ./venv/bin/pip install -r requirements.txt
        EOF

    # 5. サービス再起動とエラーログ確認
    - name: Restart Service and Check Logs
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          echo "=== Stopping service if running ==="
          sudo systemctl stop discord-bot || true

          echo "=== Checking bot.py exists ==="
          ls -la /opt/minecraft/bot/bot.py

          echo "=== Checking .env file ==="
          ls -la /opt/minecraft/bot/.env || echo ".env file not found"

          echo "=== Testing bot manually (first 5 seconds) ==="
          cd /opt/minecraft/bot
          timeout 5 ./venv/bin/python3 bot.py || echo "Manual test completed"

          echo "=== Starting service ==="
          sudo systemctl daemon-reload
          sudo systemctl start discord-bot

          echo "=== Waiting 3 seconds ==="
          sleep 3

          echo "=== Service status ==="
          sudo systemctl status discord-bot --no-pager || true

          echo "=== Recent logs ==="
          sudo journalctl -u discord-bot -n 50 --no-pager
        EOF

    # 6. デプロイ成功通知
    - name: Notify Discord on Success
      if: success()
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        # 1行目をタイトルとして抽出、残りを詳細として処理
        TITLE=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/"/\\"/g')
        BODY=$(echo "$COMMIT_MSG" | tail -n +2 | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        if [ -n "$BODY" ]; then
          DESC="[$TITLE]($COMMIT_URL)\\n\\n$BODY"
        else
          DESC="[$TITLE]($COMMIT_URL)"
        fi
        curl -H "Content-Type: application/json" \
          -d "{\"flags\":4096,\"embeds\":[{\"title\":\"✅ デプロイ成功\",\"description\":\"$DESC\",\"color\":3066993}]}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

    # 7. デプロイ失敗通知
    - name: Notify Discord on Failure
      if: failure()
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/"/\\"/g')
        BODY=$(echo "$COMMIT_MSG" | tail -n +2 | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        if [ -n "$BODY" ]; then
          DESC="[$TITLE]($COMMIT_URL)\\n\\n$BODY"
        else
          DESC="[$TITLE]($COMMIT_URL)"
        fi
        curl -H "Content-Type: application/json" \
          -d "{\"flags\":4096,\"embeds\":[{\"title\":\"❌ デプロイ失敗\",\"description\":\"$DESC\",\"color\":15158332}]}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
