name: Deploy Bot to OCI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    # 0. rsyncのインストール
    - name: Install rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync

    # 1. SSH鍵のセットアップ
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "${{ secrets.OCI_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

    # 2. リモートホストにrsyncをインストール（未インストールの場合のみ）
    - name: Install rsync on remote
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} "which rsync || (sudo apt-get update && sudo apt-get install -y rsync)"

    # 3. ファイル転送 (rsync)
    - name: Sync files to OCI
      run: |
        rsync -avz --delete \
          --exclude '.git' \
          --exclude '.env' \
          --exclude 'venv' \
          --exclude 'user_permissions.json' \
          --exclude '.backup_fingerprints.json' \
          --exclude 'logs' \
          -e "ssh -i ~/.ssh/id_rsa" \
          ./ ubuntu@${{ secrets.OCI_HOST }}:/opt/minecraft/bot/

    # 4. systemdユニットのデプロイと有効化
    - name: Deploy systemd unit and enable
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          if [ -f /opt/minecraft/bot/systemd/discord-bot.service ]; then
            sudo cp /opt/minecraft/bot/systemd/discord-bot.service /etc/systemd/system/discord-bot.service
            sudo chmod 644 /etc/systemd/system/discord-bot.service
            sudo systemctl daemon-reload
            sudo systemctl enable discord-bot
          fi
        EOF

    # 5. 依存関係の更新
    - name: Install dependencies
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          cd /opt/minecraft/bot
          ./venv/bin/python -m pip install --upgrade pip==26.1.2
          ./venv/bin/python -m pip install --upgrade --require-hashes -r requirements.txt
          ./venv/bin/python -m pip check
        EOF

    # 6. サービス再起動
    - name: Restart service
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.OCI_HOST }} << 'EOF'
          sudo systemctl stop discord-bot || true
          sudo systemctl daemon-reload
          sudo systemctl start discord-bot
          sleep 3
          sudo systemctl is-active discord-bot
        EOF

    # 7. デプロイ成功通知
    - name: Notify Discord on Success
      if: success()
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1)
        BODY=$(echo "$COMMIT_MSG" | tail -n +2)
        if [ -n "$BODY" ]; then
          DESC=$(printf "[%s](%s)\n\n%s" "$TITLE" "$COMMIT_URL" "$BODY")
        else
          DESC=$(printf "[%s](%s)" "$TITLE" "$COMMIT_URL")
        fi
        jq -n \
          --arg desc "$DESC" \
          '{flags:4096,embeds:[{title:"✅ デプロイ成功",description:$desc,color:3066993}]}' \
          | curl -sS -H "Content-Type: application/json" -d @- ${{ secrets.DISCORD_WEBHOOK_URL }}

    # 8. デプロイ失敗通知
    - name: Notify Discord on Failure
      if: failure()
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        TITLE=$(echo "$COMMIT_MSG" | head -n 1)
        BODY=$(echo "$COMMIT_MSG" | tail -n +2)
        if [ -n "$BODY" ]; then
          DESC=$(printf "[%s](%s)\n\n%s" "$TITLE" "$COMMIT_URL" "$BODY")
        else
          DESC=$(printf "[%s](%s)" "$TITLE" "$COMMIT_URL")
        fi
        jq -n \
          --arg desc "$DESC" \
          '{flags:4096,embeds:[{title:"❌ デプロイ失敗",description:$desc,color:15158332}]}' \
          | curl -sS -H "Content-Type: application/json" -d @- ${{ secrets.DISCORD_WEBHOOK_URL }}
