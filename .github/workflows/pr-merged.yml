name: PR Merged Notification

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR commits and notify Discord
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # コミット一覧を取得（最大10件）、リンク付きで改行を\nにエスケープ
          COMMITS=$(gh pr view $PR_NUMBER --json commits \
            --jq --arg repo "$REPO_URL" '.commits[:10] | .[] | "├─ [" + .messageHeadline + "](" + $repo + "/commit/" + .oid + ")"' \
            | sed '$ s/├─/└─/' \
            | sed ':a;N;$!ba;s/\n/\\n/g')

          # PRタイトルの特殊文字をエスケープ
          ESCAPED_TITLE=$(echo "$PR_TITLE" | sed 's/"/\\"/g')

          # 通知送信
          DESC="#${PR_NUMBER} ${ESCAPED_TITLE}\\n\\n${COMMITS}"
          curl -H "Content-Type: application/json" \
            -d "{\"flags\":4096,\"embeds\":[{\"title\":\"✅ PRマージ: ${BASE_BRANCH}\",\"description\":\"$DESC\",\"url\":\"$PR_URL\",\"color\":3066993}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
