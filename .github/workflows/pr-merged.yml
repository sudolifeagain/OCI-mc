name: PR Merged Notification

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR commits and notify Discord
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # コミット一覧を取得（最大10件）、リンク付き
          COMMITS=$(gh pr view $PR_NUMBER --json commits \
            --jq --arg repo "$REPO_URL" '.commits[:10] | .[] | "├─ [" + .messageHeadline + "](" + $repo + "/commit/" + .oid + ")"' \
            | sed '$ s/├─/└─/')

          # 説明文を構築してJSONエスケープ
          DESC=$(printf "#%s %s\n\n%s" "$PR_NUMBER" "$PR_TITLE" "$COMMITS")
          ESCAPED_DESC=$(echo "$DESC" | jq -Rs '.')

          # 通知送信（jqでJSON構築）
          jq -n \
            --arg title "PRマージ: ${BASE_BRANCH}" \
            --argjson desc "$ESCAPED_DESC" \
            --arg url "$PR_URL" \
            '{flags:4096,embeds:[{title:$title,description:$desc,url:$url,color:3066993}]}' \
            | curl -H "Content-Type: application/json" -d @- ${{ secrets.DISCORD_WEBHOOK_URL }}
