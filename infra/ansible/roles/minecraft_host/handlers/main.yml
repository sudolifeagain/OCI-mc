---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl --system
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
