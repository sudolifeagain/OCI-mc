---
- name: Require Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_major_version == "24"
    fail_msg: This playbook supports Ubuntu 24.04 only

- name: Install host management packages
  ansible.builtin.apt:
    name:
      - acl
      - curl
      - git
      - python3
      - python3-venv
      - rsync
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read host timezone
  ansible.builtin.command:
    cmd: /usr/bin/timedatectl show --property=Timezone --value
  register: minecraft_current_timezone
  changed_when: false
  check_mode: false

- name: Set host timezone
  ansible.builtin.command:
    cmd: "/usr/bin/timedatectl set-timezone {{ minecraft_timezone }}"
  when: minecraft_current_timezone.stdout != minecraft_timezone
  changed_when: true

- name: Disable unattended automatic reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52oci-mc-maintenance
    owner: root
    group: root
    mode: "0644"
    content: |
      // Security updates are installed automatically. Reboots are gated by
      // minecraft-maintenance-reboot.service.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

- name: Disable swap activation from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#]\S+\s+\S+\s+swap\s+'
    state: absent
    backup: true

- name: Disable active swap
  ansible.builtin.command:
    cmd: /sbin/swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Configure Minecraft swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-disable-swap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      vm.swappiness=0
  notify: Apply sysctl settings

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Limit persistent journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-oci-mc.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ minecraft_journald_max_use }}
  notify: Restart journald

- name: Create Minecraft server groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    system: true
    state: present
  loop: "{{ minecraft_server_accounts }}"

- name: Create Minecraft server users
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.name }}"
    home: "{{ item.home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present
  loop: "{{ minecraft_server_accounts }}"

- name: Grant the bot access to server groups
  ansible.builtin.user:
    name: "{{ minecraft_bot_user }}"
    groups: "{{ minecraft_server_accounts | map(attribute='name') | join(',') }}"
    append: true

- name: Protect Minecraft server root directories
  ansible.builtin.file:
    path: "{{ item.home }}"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "2770"
    state: directory
  loop: "{{ minecraft_server_accounts }}"

- name: Protect server.properties files
  ansible.builtin.stat:
    path: "{{ item.home }}/server.properties"
  loop: "{{ minecraft_server_accounts }}"
  register: minecraft_server_properties

- name: Protect existing server.properties files
  ansible.builtin.file:
    path: "{{ item.item.home }}/server.properties"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.name }}"
    mode: "0640"
    state: file
  loop: "{{ minecraft_server_properties.results }}"
  when: item.stat.exists

- name: Check Forge process before installing the reviewed compatibility addon
  ansible.builtin.command:
    argv: [pgrep, -u, mc-forge, -f, java]
  register: minecraft_forge_java_process
  changed_when: false
  failed_when: minecraft_forge_java_process.rc not in [0, 1]
  check_mode: false

- name: Require Forge to be stopped for addon installation
  ansible.builtin.assert:
    that:
      - minecraft_forge_java_process.rc == 1
    fail_msg: Stop Forge through the bot deployment lifecycle before modifying mods
  when: not ansible_check_mode

- name: Check whether TFMG Optimizer is already installed
  ansible.builtin.stat:
    path: /opt/minecraft/forge/mods/tfmg_patch-1.0.2.jar
  register: minecraft_tfmg_optimizer

- name: Create private Forge upgrade backup directory
  ansible.builtin.file:
    path: /opt/minecraft/.forge-client-upgrade-backups
    owner: root
    group: root
    mode: "0700"
    state: directory
  when: not minecraft_tfmg_optimizer.stat.exists

- name: Preserve world and configuration before adding TFMG Optimizer
  ansible.builtin.command:
    argv:
      - tar
      - -czf
      - /opt/minecraft/.forge-client-upgrade-backups/pre-tfmg-optimizer-8007822.partial.tar.gz
      - -C
      - /opt/minecraft/forge
      - world
      - mods
      - config
      - defaultconfigs
      - server.properties
      - user_jvm_args.txt
    creates: /opt/minecraft/.forge-client-upgrade-backups/pre-tfmg-optimizer-8007822.tar.gz
  register: minecraft_tfmg_upgrade_backup
  when:
    - not ansible_check_mode
    - not minecraft_tfmg_optimizer.stat.exists

- name: Finalize the complete Forge upgrade backup
  ansible.builtin.command:
    argv:
      - mv
      - --
      - /opt/minecraft/.forge-client-upgrade-backups/pre-tfmg-optimizer-8007822.partial.tar.gz
      - /opt/minecraft/.forge-client-upgrade-backups/pre-tfmg-optimizer-8007822.tar.gz
  when:
    - not ansible_check_mode
    - minecraft_tfmg_upgrade_backup is changed
  changed_when: true

- name: Protect the Forge upgrade archive
  ansible.builtin.file:
    path: /opt/minecraft/.forge-client-upgrade-backups/pre-tfmg-optimizer-8007822.tar.gz
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - not minecraft_tfmg_optimizer.stat.exists

- name: Install published TFMG Optimizer
  ansible.builtin.get_url:
    url: https://mediafilez.forgecdn.net/files/8007/822/tfmg_patch.jar
    dest: /opt/minecraft/forge/mods/tfmg_patch-1.0.2.jar
    checksum: sha256:7bd2852c2d93f48f6c97ceb8139e6e1e0d94e41b61163db9b91b85a5044afe98
    owner: mc-forge
    group: mc-forge
    mode: "0640"
    timeout: 60
  when: not ansible_check_mode

- name: Check whether the reviewed Clockwork update is installed
  ansible.builtin.stat:
    path: /opt/minecraft/forge/mods/clockwork-0.5.6.jar
  register: minecraft_clockwork_update

- name: Create private backup directory for the startup compatibility update
  ansible.builtin.file:
    path: /opt/minecraft/.forge-client-upgrade-backups
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: Select a fresh pre-update archive
  ansible.builtin.set_fact:
    minecraft_startup_backup: "/opt/minecraft/.forge-client-upgrade-backups/pre-startup-cleanup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"

- name: Preserve the current world and MOD configuration before the startup update
  ansible.builtin.command:
    argv:
      - tar
      - -czf
      - "{{ minecraft_startup_backup }}.partial"
      - -C
      - /opt/minecraft/forge
      - world
      - mods
      - config
      - defaultconfigs
      - server.properties
      - user_jvm_args.txt
  when:
    - not ansible_check_mode
    - not minecraft_clockwork_update.stat.exists
  changed_when: true

- name: Validate the new Forge archive before changing MODs
  ansible.builtin.command:
    argv: [gzip, -t, "{{ minecraft_startup_backup }}.partial"]
  when:
    - not ansible_check_mode
    - not minecraft_clockwork_update.stat.exists
  changed_when: false

- name: Finalize the new Forge archive
  ansible.builtin.command:
    argv: [mv, --, "{{ minecraft_startup_backup }}.partial", "{{ minecraft_startup_backup }}"]
  when:
    - not ansible_check_mode
    - not minecraft_clockwork_update.stat.exists
  changed_when: true

- name: Protect the new Forge archive
  ansible.builtin.file:
    path: "{{ minecraft_startup_backup }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - not minecraft_clockwork_update.stat.exists

- name: Install hash-pinned published startup compatibility updates
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ minecraft_repo_root }}/scripts/update_forge_mods.py"
      - install
      - --plan
      - "{{ minecraft_repo_root }}/infra/forge-startup-updates.json"
  register: minecraft_forge_mod_updates
  changed_when: "'Changed mods: 0' not in minecraft_forge_mod_updates.stdout"
  when: not ansible_check_mode

- name: Apply reviewed Forge data repairs
  ansible.builtin.command:
    cmd: >-
      /usr/bin/python3 {{ minecraft_repo_root }}/scripts/repair_forge_data.py apply
      --plan {{ minecraft_repo_root }}/infra/forge-resource-fixes.json
  register: minecraft_forge_data_repairs
  changed_when: "'Changed jars: 0' not in minecraft_forge_data_repairs.stdout"
  when: not ansible_check_mode

- name: Apply reviewed Forge Alt data repairs
  ansible.builtin.command:
    cmd: >-
      /usr/bin/python3 {{ minecraft_repo_root }}/scripts/repair_forge_data.py apply
      --server-dir /opt/minecraft/forge-alt
      --plan {{ minecraft_repo_root }}/infra/forge-alt-resource-fixes.json
      --backup-dir /opt/minecraft/.forge-alt-data-backups
  register: minecraft_forge_alt_data_repairs
  changed_when: "'Changed jars: 0' not in minecraft_forge_alt_data_repairs.stdout"
  when: not ansible_check_mode

- name: Read Cold Sweat configuration
  ansible.builtin.stat:
    path: /opt/minecraft/forge/config/coldsweat/world.toml
  register: minecraft_cold_sweat_config

- name: Remove references to unavailable Cold Sweat biomes and dimensions
  ansible.builtin.lineinfile:
    path: /opt/minecraft/forge/config/coldsweat/world.toml
    regexp: '^\s*\["(?:environmental:marsh|twilightforest:twilight_forest_type)",.*\],?\s*$'
    state: absent
    backup: true
  when: minecraft_cold_sweat_config.stat.exists

- name: Create bot runtime directory
  ansible.builtin.file:
    path: "{{ minecraft_runtime_dir }}"
    owner: "{{ minecraft_bot_user }}"
    group: "{{ minecraft_bot_user }}"
    mode: "0700"
    state: directory

- name: Create bot PID directory
  ansible.builtin.file:
    path: "{{ minecraft_runtime_dir }}/pids"
    owner: "{{ minecraft_bot_user }}"
    group: "{{ minecraft_bot_user }}"
    mode: "0700"
    state: directory

- name: Create maintenance state directory
  ansible.builtin.file:
    path: "{{ minecraft_maintenance_state_dir }}"
    owner: "{{ minecraft_bot_user }}"
    group: "{{ minecraft_bot_user }}"
    mode: "0700"
    state: directory

- name: Install privileged reboot finalizer
  ansible.builtin.copy:
    src: oci-mc-maintenance-reboot-finalize
    dest: "{{ minecraft_reboot_finalize_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Check bot environment file
  ansible.builtin.stat:
    path: "{{ minecraft_repo_root }}/.env"
  register: minecraft_env_file

- name: Protect bot environment file
  ansible.builtin.file:
    path: "{{ minecraft_repo_root }}/.env"
    owner: "{{ minecraft_bot_user }}"
    group: "{{ minecraft_bot_user }}"
    mode: "0600"
  when: minecraft_env_file.stat.exists

- name: Install systemd units
  ansible.builtin.copy:
    src: "{{ minecraft_repo_root }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ minecraft_systemd_units }}"
  notify: Reload systemd

- name: Flush systemd handlers
  ansible.builtin.meta: flush_handlers

- name: Read installed services
  ansible.builtin.service_facts:

- name: Enable Discord bot service
  ansible.builtin.systemd_service:
    name: discord-bot.service
    enabled: true

- name: Enable maintenance reboot timer
  ansible.builtin.systemd_service:
    name: minecraft-maintenance-reboot.timer
    enabled: true
    state: started
  when: not ansible_check_mode or "minecraft-maintenance-reboot.timer" in ansible_facts.services

- name: Enable post-reboot verification
  ansible.builtin.systemd_service:
    name: minecraft-post-reboot.service
    enabled: true
  when: not ansible_check_mode or "minecraft-post-reboot.service" in ansible_facts.services
